<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1000" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="mBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
    <marker id="mAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#d97706"/>
    </marker>
    <marker id="mGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
    <style>
      .title    { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .zh       { font-size: 17px; font-weight: 700; }
      .zsub     { font-size: 13px; fill: #64748b; }
      .card-t   { font-size: 14px; font-weight: 700; fill: #1e293b; }
      .t        { font-size: 13.5px; fill: #334155; }
      .lbl      { font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; }
      .mono     { font-size: 13px; font-family: 'SF Mono', Menlo, monospace; fill: #334155; }
      .note     { font-size: 13px; fill: #475569; }
      .emph     { font-size: 13.5px; fill: #92400e; }
      .arrlbl   { font-size: 12.5px; font-weight: 600; }
      .box      { fill: #ffffff; stroke-width: 1.5; rx: 8; }
      .foot     { font-size: 14px; font-style: italic; fill: #64748b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1520" height="1000" fill="#ffffff"/>

  <text x="760" y="46" text-anchor="middle" class="title">Traditional Evaluation Harness for an Agentic Workflow</text>
  <text x="760" y="74" text-anchor="middle" class="subtitle">Example: a support-bot agent · 200 tasks · The ground-truth dataset is the answer key that turns a demo into an evaluation</text>

  <!-- ══ Zone 1: Ground-truth dataset (the hero) ══ -->
  <rect x="60" y="110" width="440" height="700" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="84" y="148" class="zh" fill="#b45309">1 · GROUND-TRUTH DATASET</text>
  <text x="84" y="170" class="zsub">The answer key — human-labeled, fixed &amp; hash-pinned</text>
  <text x="84" y="198" class="t">Each entry pairs a task with its known-correct</text>
  <text x="84" y="216" class="t">expected outcome.</text>

  <rect x="84" y="234" width="392" height="142" rx="8" class="box" stroke="#e5d5ae"/>
  <text x="100" y="262" class="card-t">Task #1 · “Reset my password”</text>
  <text x="100" y="282" class="t">Context: user u-1234</text>
  <text x="100" y="306" class="lbl" fill="#b45309">EXPECTED OUTCOME</text>
  <text x="100" y="328" class="mono">· tool:  reset_password(user="u-1234")</text>
  <text x="100" y="348" class="mono">· final: “Password reset link sent”</text>

  <rect x="84" y="392" width="392" height="142" rx="8" class="box" stroke="#e5d5ae"/>
  <text x="100" y="420" class="card-t">Task #2 · “Where’s order o-987?”</text>
  <text x="100" y="440" class="t">Context: user u-1234</text>
  <text x="100" y="464" class="lbl" fill="#b45309">EXPECTED OUTCOME</text>
  <text x="100" y="486" class="mono">· tool:  get_order("u-1234", "o-987")</text>
  <text x="100" y="506" class="mono">· final: “Shipped — ETA Thursday”</text>

  <rect x="84" y="550" width="392" height="88" rx="8" class="box" stroke="#e5d5ae"/>
  <text x="100" y="580" class="card-t">Task #3 … Task #200</text>
  <text x="100" y="602" class="t">one entry per task, each with its expected</text>
  <text x="100" y="620" class="t">outcome (real requests + verified answers)</text>

  <rect x="84" y="656" width="392" height="128" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="684" class="t" font-weight="700" fill="#92400e">Why this box is the point:</text>
  <text x="100" y="706" class="emph">No ground-truth dataset → “it looked fine</text>
  <text x="100" y="724" class="emph">on 20 tries”. A demo, not an evaluation.</text>
  <text x="100" y="746" class="emph">Fixed + hash-pinned → runs are reproducible</text>
  <text x="100" y="764" class="emph">and diffable across changes.</text>

  <!-- ══ Zone 2: Agent under test ══ -->
  <rect x="600" y="110" width="420" height="400" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="624" y="148" class="zh" fill="#1d4ed8">2 · AGENT UNDER TEST</text>
  <text x="624" y="170" class="zsub">an LLM running a tool loop</text>

  <rect x="624" y="192" width="372" height="104" rx="8" class="box" stroke="#bfdbfe"/>
  <text x="640" y="220" class="card-t">Agent (LLM)</text>
  <text x="640" y="244" class="t">Reads the task, plans, calls tools,</text>
  <text x="640" y="264" class="t">repeats, then emits a final answer.</text>

  <rect x="624" y="312" width="372" height="68" rx="8" class="box" stroke="#bfdbfe"/>
  <text x="640" y="338" class="mono">Tools:  reset_password() · get_order() · …</text>
  <text x="640" y="360" class="note">the agent’s real tool environment</text>

  <text x="624" y="420" class="lbl" fill="#1d4ed8">ACTUAL OUTPUT (per task)</text>
  <text x="624" y="444" class="t">final response + full tool-call trace —</text>
  <text x="624" y="462" class="t">what the agent actually did</text>

  <!-- ══ Zone 3: Scorer ══ -->
  <rect x="600" y="560" width="420" height="260" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="624" y="598" class="zh" fill="#15803d">3 · SCORER (VERIFIER)</text>
  <text x="624" y="620" class="zsub">compares actual output vs expected outcome</text>

  <rect x="624" y="636" width="372" height="152" rx="8" class="box" stroke="#bbf7d0"/>
  <text x="640" y="664" class="card-t">Per-task checks:</text>
  <text x="640" y="688" class="t">· expected tool calls present &amp; correct?</text>
  <text x="640" y="708" class="t">· final message matches expected?</text>
  <text x="640" y="732" class="note" font-style="italic">exact match · rule check · LLM-as-judge</text>
  <text x="640" y="762" class="t" font-weight="700" fill="#15803d">→ each task scores PASS or FAIL</text>

  <!-- ══ Zone 4: Results ══ -->
  <rect x="1140" y="110" width="320" height="400" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1164" y="148" class="zh" fill="#334155">4 · RESULTS &amp; REPORT</text>
  <text x="1164" y="170" class="zsub">a number you can rerun &amp; diff</text>

  <rect x="1164" y="192" width="272" height="240" rx="8" class="box" stroke="#cbd5e1"/>
  <text x="1180" y="222" class="card-t">200 tasks → 188 PASS</text>
  <text x="1180" y="244" class="t">pass rate = 94.0%</text>
  <text x="1180" y="272" class="t">failures listed per task</text>
  <text x="1180" y="290" class="t">(actual vs expected diff)</text>
  <text x="1180" y="318" class="t">rerun after a change →</text>
  <text x="1180" y="336" class="t">regression delta (94% → 96%)</text>
  <text x="1180" y="364" class="t">run pinned to:</text>
  <text x="1180" y="384" class="mono">model id · prompt hash</text>
  <text x="1180" y="402" class="mono">dataset hash</text>

  <!-- ══ Connectors ══ -->
  <!-- dataset → agent: task input (into Agent (LLM) box) -->
  <path d="M 500 250 L 621 250" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#mBlue)"/>
  <text x="548" y="238" text-anchor="middle" class="arrlbl" fill="#1d4ed8">task input</text>

  <!-- agent → scorer: actual output (into Per-task checks box) -->
  <path d="M 810 510 L 810 633" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#mBlue)"/>
  <text x="824" y="576" class="arrlbl" fill="#1d4ed8">actual output + tool trace</text>

  <!-- dataset → scorer: expected outcome (elbow, into Per-task checks box bottom) -->
  <path d="M 300 810 L 300 870 L 720 870 L 720 791" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#mAmber)"/>
  <text x="510" y="858" text-anchor="middle" class="arrlbl" fill="#92400e">expected outcome (the answer key)</text>

  <!-- scorer → results: per-task scores (elbow, into results box bottom) -->
  <path d="M 1020 740 L 1300 740 L 1300 435" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#mGreen)"/>
  <text x="1150" y="728" text-anchor="middle" class="arrlbl" fill="#15803d">per-task scores</text>

  <text x="760" y="952" text-anchor="middle" class="foot">Traditional = offline, reference-based: a fixed, human-labeled ground-truth dataset is the source of truth — the agent is measured, not trained.</text>
</svg>
